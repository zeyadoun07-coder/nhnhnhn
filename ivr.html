<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة دعاء عون التعليمية - نظام الرد الآلي IVR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        /* شاشة البداية لكسر حظر الصوت */
        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; text-align: center; padding: 20px; transition: opacity 0.5s ease;
        }
        .pulse-btn {
            background: linear-gradient(45deg, #0ea5e9, #3b82f6);
            color: white; border: none; border-radius: 50px;
            padding: 22px 40px; font-size: 20px; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.7);
            animation: pulse 1.8s infinite; margin-top: 25px;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(14, 165, 233, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
        }

        /* تصميم شاشة النظام */
        .container { background: #1e293b; border: 2px solid #334155; border-radius: 20px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 22px; color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .screen { background: #0f172a; border: 1px solid #475569; border-radius: 12px; padding: 15px; min-height: 105px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; color: #f8fafc; line-height: 1.7; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .btn { background: #334155; color: #fff; border: none; border-radius: 50px; padding: 16px 0; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn:active { background: #38bdf8; color: #0f172a; transform: scale(0.95); }
        .btn-action { background: #0284c7; font-size: 15px; border-radius: 12px; grid-column: span 3; padding: 14px; }
        .input-box { display: none; margin-top: 15px; background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid #334155; }
        .input-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #64748b; background: #1e293b; color: #fff; font-size: 16px; text-align: center; margin-bottom: 10px; }
        .input-box button { background: #10b981; color: #fff; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; }
        .result-card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 10px; padding: 12px; margin-top: 8px; width: 100%; text-align: center; }
        .highlight { color: #38bdf8; font-weight: bold; font-size: 18px; letter-spacing: 1px; }
    </style>
</head>
<body>

<!-- شاشة البداية -->
<div id="startOverlay" onclick="startPlatform()">
    <h1 style="font-size: 28px; margin-bottom: 10px;">منصة مس دعاء أونلاين</h1>
    <p style="color: #94a3b8; font-size: 16px;">نظام الاستعلام الصوتي والرد الآلي الذكي</p>
    <button class="pulse-btn">📞 اضغط للدخول والاستماع</button>
</div>

<!-- واجهة المنصة الرئيسية -->
<div class="container">
    <h1>منصة دعاء عون التعليمية</h1>
    <p class="subtitle">نظام الرد الآلي التفاعلي (IVR)</p>

    <div class="screen" id="displayScreen">
        جاري تفعيل النظام الصوتي...
    </div>

    <button class="btn btn-action" onclick="playWelcome()">🔄 إعادة رسالة الترحيب</button>

    <div class="keypad" style="margin-top: 18px;">
        <button class="btn" onclick="selectOption(1)">1</button>
        <button class="btn" onclick="selectOption(2)">2</button>
        <button class="btn" onclick="selectOption(3)">3</button>
        <button class="btn" onclick="selectOption(4)">4</button>
        <button class="btn" onclick="selectOption(5)">5</button>
        <button class="btn" onclick="selectOption(0)">0</button>
    </div>

    <div id="studentInput" class="input-box">
        <input type="text" id="studentName" placeholder="اكتب اسم الطالب (مثال: ياسين ابراهيم)">
        <button onclick="showStudentCode()">🔍 بحث عن الكود واليوزر نيم</button>
    </div>
</div>

<script>
    // قاعدة بيانات الطلاب الخاصة بك
    const studentsDatabase = {
        '23587': { name: 'GHKLO', realName: 'ياسين ابراهيم', id: '23587' },
        '22586': { name: 'DFYMQ', realName: 'ادم رامي', id: '22586' },
        '12458': { name: 'GGTYS', realName: 'حبيبة معمر', id: '12458' },
        '52587': { name: 'MNBVC', realName: 'ناصر شنكار', id: '52587' },
        '32147': { name: 'DERTY', realName: 'يوسف الكلاف', id: '32147' },
        '21478': { name: 'HYHUI', realName: 'عبد الرحمن لطفي', id: '21478' },
        '14789': { name: 'HYHYJ', realName: 'رودينا جميل', id: '14789' },
        '21586': { name: 'SDFRT', realName: 'الين الرحماني', id: '21586' },
        '15896': { name: 'GKLMO', realName: 'احمد بسيوني', id: '15896' },
        '66652': { name: 'JKUYT', realName: 'ابراهيم عون', id: '66652' },
        '36598': { name: 'NHYUT', realName: 'مريم سويلم', id: '36598' },
        '36987': { name: 'MKIUY', realName: 'ندين نصر', id: '36987' },
        '89742': { name: 'VKILO', realName: 'شهد عمرو', id: '89742' },
        '78963': { name: 'POIUY', realName: 'هنا رخا', id: '78963' },
        '20126': { name: 'BBBVG', realName: 'شهد البحراوي', id: '20126' },
        '25801': { name: 'DTDTD', realName: 'ملك هاني كشك', id: '25801' },
        '15928': { name: 'SESES', realName: 'عائشة ماجد', id: '15928' },
        '32328': { name: 'HUHUH', realName: 'ياسين الحويف', id: '32328' },
                '66658': { name: 'SSAAY', realName: ' ملك شريف', id: '66658' }

    };

    // دالة توحيد الحروف العربية وتجاهل الأخطاء الإملائية والهمزات والمسافات
    function normalizeArabic(text) {
        return text
            .trim()
            .replace(/\s+/g, ' ')           // إزالة المسافات الزائدة
            .replace(/[أإآ]/g, 'ا')         // توحيد الهمزات إلى ألف
            .replace(/ة/g, 'ه')             // تحويل التاء المربوطة إلى هاء
            .replace(/ى/g, 'ي')             // تحويل الألف اللينة إلى ياء
            .replace(/عبد\s+/g, 'عبد');     // دمج "عبد الرحمن" و "عبدالرحمن"
    }

    // دالة حساب التشابه (للتغاضي عن الحروف الناقصة أو الزائدة البسيطة)
    function isFuzzyMatch(input, target) {
        const normInput = normalizeArabic(input);
        const normTarget = normalizeArabic(target);

        // 1. تطابق مباشر أو جزئي
        if (normTarget.includes(normInput) && normInput.length >= 3) return true;

        // 2. التحقق من نسبة التشابه (Levenshtein Distance) للتغاضي عن حرف ناقص أو غلط
        const len1 = normInput.length, len2 = normTarget.length;
        const matrix = Array.from({ length: len1 + 1 }, () => Array(len2 + 1).fill(0));
        for (let i = 0; i <= len1; i++) matrix[i][0] = i;
        for (let j = 0; j <= len2; j++) matrix[0][j] = j;

        for (let i = 1; i <= len1; i++) {
            for (let j = 1; j <= len2; j++) {
                const cost = normInput[i - 1] === normTarget[j - 1] ? 0 : 1;
                matrix[i][j] = Math.min(
                    matrix[i - 1][j] + 1,      // حذف
                    matrix[i][j - 1] + 1,      // إضافة
                    matrix[i - 1][j - 1] + cost // استبدال
                );
            }
        }
        const distance = matrix[len1][len2];
        // السماح بـ خطأين إملائيين كحد أقصى حسب طول الاسم
        const maxAllowedErrors = normTarget.length > 7 ? 2 : 1;
        return distance <= maxAllowedErrors;
    }

    function startPlatform() {
        const overlay = document.getElementById('startOverlay');
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 500);
        playWelcome();
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.92;
            window.speechSynthesis.speak(utterance);
        }
    }

    function playWelcome() {
        let msg = "أهلاً وسهلاً بكم في منصة مس دعاء أونلاين التعليمية. من فضلك اختر من القائمة التالية: اضغط 1 للبحث عن كود الطالب. اضغط 2 للاستفسار عن الامتحانات. اضغط 3 للتواصل مع الدعم الفني. اضغط 4 لمواعيد الحصص. اضغط 5 للمراجعات النهائية.";
        document.getElementById('displayScreen').innerHTML = msg;
        document.getElementById('studentInput').style.display = 'none';
        speak(msg);
    }

    function selectOption(num) {
        let screen = document.getElementById('displayScreen');
        let inputDiv = document.getElementById('studentInput');
        inputDiv.style.display = 'none';

        if(num === 1) {
            screen.innerHTML = "الخيار 1: البحث عن كود الطالب واليوزر نيم.<br>برجاء كتابة اسم الطالب بالأسفل.";
            speak("الخيار الأول. برجاء كتابة اسم الطالب في الخانة المخصصة.");
            inputDiv.style.display = 'block';
        } else if(num === 2) {
            screen.innerHTML = "الخيار 2: استعلام الامتحانات.<br>مواعيد الامتحانات القادمة متاحة عبر جدول الحصص.";
            speak("الخيار الثاني. استعلام الامتحانات.");
        } else if(num === 3) {
            screen.innerHTML = "الخيار 3: التواصل مع الدعم الفني عبر واتساب المنصة.";
            speak("الخيار الثالث. التواصل مع الدعم الفني.");
        } else if(num === 4) {
            screen.innerHTML = "الخيار 4: مواعيد الحصص المباشرة والجدول الأسبوعي.";
            speak("الخيار الرابع. مواعيد الحصص المباشرة.");
        } else if(num === 5) {
            screen.innerHTML = "الخيار 5: مركز المذكرات وملخصات ليلة الامتحان.";
            speak("الخيار الخامس. مذكرات ومراجعات ليلة الامتحان.");
        } else {
            screen.innerHTML = "الرقم غير صحيح، اختر رقم من 1 إلى 5.";
            speak("الرقم غير صحيح.");
        }
    }

    function showStudentCode() {
        let inputVal = document.getElementById('studentName').value.trim();
        let screen = document.getElementById('displayScreen');

        if(inputVal === "") {
            screen.innerHTML = "الرجاء إدخال اسم الطالب أولاً!";
            speak("برجاء كتابة الاسم أولاً.");
            return;
        }

        // البحث في القائمة باستخدام خوارزمية البحث الذكي
        let foundStudents = Object.values(studentsDatabase).filter(student => 
            isFuzzyMatch(inputVal, student.realName)
        );

        if (foundStudents.length === 1) {
            let st = foundStudents[0];
            screen.innerHTML = `
                <div>أهلاً يا <b>${st.realName}</b> 👋</div>
                <div class="result-card">
                    <div>الكود (ID): <span class="highlight">${st.id}</span></div>
                    <div>اسم المستخدم (Username): <span class="highlight">${st.name}</span></div>
                </div>
            `;
            speak(`أهلاً بك يا ${st.realName}. تم العثور على الكود واسم المستخدم الخاص بك بنجاح.`);
        } else if (foundStudents.length > 1) {
            // في حال تشابه الأسماء مثل (ياسين ابراهيم / ياسين الحويف) أو (شهد عمرو / شهد البحراوي)
            let namesList = foundStudents.map(s => s.realName).join(" ، أو ");
            screen.innerHTML = `يوجد أكثر من طالب بهذا الاسم:<br><b>${namesList}</b><br>برجاء كتابة الاسم ثنائياً للتحديد.`;
            speak("يوجد أكثر من طالب بهذا الاسم، برجاء كتابة الاسم ثنائياً.");
        } else {
            screen.innerHTML = "❌ عذراً، لم يتم العثور على طالب بهذا الاسم. تأكد من كتابة الاسم بشكل صحيح أو تواصل مع الدعم الفني (رقم 3).";
            speak("عذراً، لم يتم العثور على هذا الاسم في القائمة.");
        }
    }
</script>

</body>
</html>
